#:schema node_modules/wrangler/config-schema.json
#
# ⚠️ 这是「模板」，不是最终部署配置。
#    部署前由 scripts/gen-config.mjs 从 GitHub Variables/Secrets（本地则读环境变量 /
#    .dev.vars）注入真实值，生成真正的 wrangler.deploy.toml 后再 wrangler deploy。
#
#    原因：wrangler 不支持在 wrangler.toml 里插值环境变量，custom_domain 路由更是
#    结构化字段，只能由脚本拼出来。因此「域名放进 Secrets、必填、不填就部署失败」
#    只能靠这层生成来落地。
#
#    ⚠️ 本文件的值一律写「合法默认值」，不用 __TOKEN__ 占位——这不是疏忽：
#    wrangler 会校验字段格式（桶名必须 3-63 位小写字母/数字/连字符），
#    非法占位符会让 `wrangler dev` 在**配置解析阶段**直接退出，程序根本没机会运行。
#    gen-config 按「键名逐行覆盖」注入真值，所以这里写什么默认值都能被正确替换。
#
#    千万别把本文件里的默认值改成你的真实域名再提交——仓库是公开的，一旦固化，
#    别人 fork 后会直接对着你的域名与 R2 桶部署（下载直链会指向你的桶）。
name = "r2share"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# 静态资源（style.css / app.js）
# 注意：静态资源请求由 CF 边缘直接服务，免费且无上限，不消耗 Workers 请求数。
# run_worker_first 命中时 API 与首页先执行 Worker，其余静态资源不执行 Worker →
# 页面加载的 Workers 消耗从「1 HTML + 1 css + 1 js = 3 次」降到 1 次，
# 10 万请求/天的免费额度只被首页 HTML 占用。
# binding 是必需的：有了它才能在 Worker 里用 env.ASSETS 做兜底转发
[assets]
directory = "./public"
binding = "ASSETS"
# 首页 "/" 必须显式列进来：run_worker_first 没命中时，请求会先去找同名静态文件，
# 只有找不到才回落到 Worker。眼下 public/ 里没有 index.html，所以也能跑到 Worker，
# 但那是个隐式前提——哪天往 public/ 放一个 index.html，首页就会变成纯静态文件，
# 登录态注入和 window.__CFG__ 会一起失效。显式写死，杜绝这种误伤。
run_worker_first = ["/", "/api/*"]

# 自定义域：Worker 站点入口（由 scripts/gen-config.mjs 按 WORKER_DOMAIN 注入）
# 用 custom_domain = true（而非 zone_name）：Cloudflare 自动创建 DNS 记录与证书，
# 所有路径直达 Worker（Worker 即源站），无需手动添加 A/CNAME 记录。
# 之前用 zone_name 传统 route 时，assets 模式会把它当 assets 路径匹配（部署警告
# "Will match assets: public\<pattern>"），且手动加的 A 记录导致 522 回源超时。
# 本地 wrangler dev 用不到路由，故模板里只保留下面这个注入点，避免 dev 解析到占位域名。
# gen:routes

# R2 公开桶：存文件与 files.json 索引
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "r2share"

# 说明：登录失败计数已改为 Worker 模块内的内存 Map（见 src/index.ts），
# 不再需要 KV 绑定——KV 免费版「同 key 每秒 1 次写 + 每天 1000 次写」的限制
# 会让爆破场景下的计数失真，也平白多出一次往返。

[vars]
# R2 桶名（presigned 签名需要用到）。必须与上面 [[r2_buckets]] bucket_name 一致，
# 否则 presigned 上传会签到另一个桶（check-deploy 有一致性检查钉住这条）。
BUCKET_NAME = "r2share"
# 下载直链域名（R2 公开桶绑定的自定义域，或 r2.dev 域名）。留空 = 本地/代理模式：
# 下载与索引改走本 Worker（/api/local-get、/api/local-index），无需配置即可本地开发。
DL_DOMAIN = ""
# 站点名称
SITE_NAME = "我的仓库"
# 登录态有效期（天）
SESSION_DAYS = "30"
# 单文件上传上限（字节），0 表示沿用 Workers 请求体上限。
# Cloudflare 账户计划（Free）对请求体的硬上限是 100 MB，超过会被边缘直接 413，
# 请求根本到不了 Worker。这里取 95 MiB 留出余量：否则用户传一个「通过了本站校验、
# 却被 CF 拦下」的文件，只会看到一个语焉不详的网络错误。
MAX_UPLOAD = "99614720"
# 生产环境上传改走 Worker 代理：'1' 开启。
# 背景：presigned 直传目标 r2.cloudflarestorage.com 在某些网络被墙（ERR_ADDRESS_UNREACHABLE），
# 开启后浏览器的上传 PUT 指向本 Worker 的 /api/local-put（同源，无需 CORS），
# 由 Worker 内部 env.BUCKET.put() 写 R2，绕开被墙端点；下载仍走 DL_DOMAIN 公开桶直链。
# 保持 '1' 时**不需要任何 R2 S3 凭证**（R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY 都不用配）。
UPLOAD_VIA_WORKER = "1"
# 模式开关（一般不用动）：'1' 强制本地代理模式，'0' 强制生产模式。
# 不设置时按「DL_DOMAIN 是否为合法 URL」自动判断——模板里 DL_DOMAIN 是空串，
# 因此 `wrangler dev` 直接跑本模板就会落到本地模式，无需额外配置。
# 想在本地区验证真实公开桶直链（而非代理下载），设 LOCAL_MODE = "0" 并配好 DL_DOMAIN。
# LOCAL_MODE = "0"

# 以下为必填项（部署时必须配置，缺失会让部署失败）：
#   ADMIN_PASSWORD       管理口令（Worker secret）
#   CLOUDFLARE_API_TOKEN 部署认证（GitHub Secret，不进入 Worker）
#   WORKER_DOMAIN        站点入口域（GitHub Variable，由 gen-config 注入路由）
#   DL_DOMAIN            下载直链域（GitHub Variable，由 gen-config 注入上面那行）
#
# 以下为选填项（有默认值 / 可自动推导，不配也能跑）：
#   SESSION_SECRET       会话签名密钥。不配则由 ADMIN_PASSWORD 派生（见 src/mode.ts 的
#                        sessionSecretOf）；单独配置的好处是「改口令不会把自己踢下线」
#   CLOUDFLARE_ACCOUNT_ID / R2_ACCOUNT_ID
#                        S3 端点用的账户 id，与 CLOUDFLARE_ACCOUNT_ID 同值，可只配一个
#   R2_ACCESS_KEY_ID     R2 S3 API 密钥。仅当 UPLOAD_VIA_WORKER="0" 走 presigned 直传时才需要
#   R2_SECRET_ACCESS_KEY 同上
#   BUCKET_NAME / SITE_NAME  已在上方 [vars] 给了默认值（r2share / 我的仓库），
#                        gen-config 会在部署时按你的实际配置覆盖
